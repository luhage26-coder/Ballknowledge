<html lang="de">

<title>Ball Knowledge</title>
<style>

:root[data-theme="dark"]{--bg:#070b2e;--card:#101a5a;--tx:#f4f6ff;--mut:#9fb0f0;--ac:#8fb4ff;--acx:#0a0f3a;--ok:#22c55e;--bad:#ef4444;--bd:#2f43a8;--lg1:#fff;--lg2:#9fb4ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -80px,rgba(124,77,255,.35),transparent 70%),radial-gradient(1.5px 1.5px at 22px 34px,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 88px 96px,rgba(255,255,255,.4),transparent),var(--bg);background-size:auto,120px 120px,120px 120px,auto;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:30px;line-height:1.1;margin:8px 0 4px;text-align:center}
h2{font-size:22px;margin:6px 0}
.sub{text-align:center;color:var(--mut);margin:0 0 18px}
.card{background:var(--card);box-shadow:0 8px 24px rgba(10,15,80,.22);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
input{width:100%;padding:13px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:17px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.btn{width:100%;padding:15px;border-radius:14px;border:0;background:linear-gradient(135deg,#3b6cff,#8a4dff);color:#fff;box-shadow:0 6px 18px rgba(80,70,255,.35);font-weight:800;font-size:17px;margin-top:10px}
.btn.alt{box-shadow:none;background:transparent;color:var(--tx);border:2px solid var(--bd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.chip{padding:12px 8px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);font-weight:700}
.chip.on{border-color:var(--ac);background:var(--card)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.note{color:var(--mut);font-size:13px;text-align:center;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl{display:flex;flex-direction:column;min-width:80px}
.pl b{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.pl span{font-size:28px;font-weight:900}
.pl.r{text-align:right;align-items:flex-end}
.pn{font-weight:800;color:var(--mut)}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:100%;background:var(--ac)}
.cl{padding:8px 0;font-size:19px;font-weight:700;transition:opacity .4s}
.g{display:grid;gap:10px;margin-top:12px}
.g2{grid-template-columns:1fr 1fr}
.o{padding:16px 12px;border-radius:14px;border:2px solid var(--bd);background:var(--card);font-weight:700;font-size:17px;text-align:center}
.o.sel{border-color:var(--ac)}
.o.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.o.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.o.dim{opacity:.45}
#msg{text-align:center;min-height:24px;font-weight:800;margin-top:10px}
.big{font-size:56px;text-align:center;margin:4px 0}
.code{font-size:44px;font-weight:900;letter-spacing:.2em;text-align:center;color:var(--ac)}
.err{color:var(--bad);text-align:center;font-weight:700}
.back{background:none;border:0;color:var(--mut);font-weight:700;font-size:15px;padding:6px 0;margin-bottom:4px}
.hl{display:grid;gap:4px;margin-top:8px}
.pc{text-align:center;position:relative;margin:4px 0;overflow:hidden}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff}
.val{font-size:28px;font-weight:900;color:var(--ac)}
.vs{text-align:center;font-weight:900;color:var(--mut);margin:-2px 0}
.fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;animation:fx .9s ease-out forwards;pointer-events:none}
@keyframes fx{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:0}}
.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12);box-shadow:0 0 0 6px rgba(34,197,94,.5)}100%{transform:scale(1)}}
.shake{animation:shake .5s;border-color:var(--bad)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.logo{font-size:clamp(42px,13vw,64px);line-height:.92;font-weight:900;text-align:center;letter-spacing:.03em;text-transform:uppercase;background:linear-gradient(180deg,var(--lg1) 20%,var(--lg2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 2px;filter:drop-shadow(0 4px 14px rgba(110,90,255,.55))}
.logo small{display:block;font-size:.3em;letter-spacing:.3em;font-weight:800;margin-top:8px}
.mark{width:76px;margin:4px auto 0}
.mark svg,.me svg,.avb svg,.pa svg{display:block;width:100%;height:auto}
.avrow{display:flex;gap:10px;align-items:center}
.me{width:56px;flex:none}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.avb{background:none;border:2px solid transparent;border-radius:50%;padding:2px;line-height:0}
.avb.on{border-color:var(--ac);box-shadow:0 0 10px var(--ac)}
.pa{display:inline-flex;align-items:center;gap:8px}
.pa svg{width:26px;height:26px;flex:none}
.jw{text-align:center}
.jsv{width:160px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.pod{position:relative;overflow:hidden;text-align:center;padding-top:6px}
.prow{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:10px 0;min-height:270px}
.pcol{display:flex;flex-direction:column;align-items:center;width:30%;min-width:96px}
.pav{width:54px}.pav svg{display:block;width:100%;height:auto}
.pnm{font-weight:800;margin:4px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trophy{font-size:46px;line-height:1.05;height:48px;animation:drop 1.1s cubic-bezier(.2,.9,.3,1.3) .7s both,glow 1.6s ease-in-out 2s infinite}
.step{width:100%;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#8a4dff,#3b6cff);display:flex;flex-direction:column;align-items:center;justify-content:center;transform-origin:bottom;animation:rise .9s ease-out both}
.step b{font-size:34px;font-weight:900;color:#fff}
.step small{color:#dfe6ff;font-weight:700}
.step.g{background:linear-gradient(180deg,#ffd54a,#f5a300)}
.step.g b,.step.g small{color:#3a2a00}
.step.e{background:var(--bd);opacity:.5}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drop{0%{transform:translateY(-230px) scale(.3) rotate(-25deg);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #ffd54a)}50%{filter:drop-shadow(0 0 16px #ffd54a)}}
.cf{position:absolute;top:-10px;font-style:normal;font-size:22px;animation:fall 2.8s ease-in infinite;pointer-events:none}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(440px) rotate(300deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

  const pool=mode==="x"?[].concat(mk("w"),mk("t"),mk("s"),mk("c")):mk(mode);

/* Raum-System mit PeerJS (WebRTC), funktioniert auf jedem Hoster */
const roomApi={
  join(name,host){
    return new Promise((resolve,reject)=>{
      if(typeof Peer==="undefined"){reject(new Error("nopeerjs"));return}
      const ID="ballknowledge-"+name;
      const OPT={config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"stun:stun.cloudflare.com:3478"}]}};
      const me={isMe:true,kind:"viewer",presence:{}};
      let remote=null,conn=null,cbs=[],peer=null,done=false;
      const fire=()=>cbs.forEach(f=>{try{f()}catch(e){console.error(e)}});
      const sendP=()=>{try{if(conn&&conn.open)conn.send({t:"p",p:me.presence})}catch(e){}};
      const attach=c=>{
        conn=c;
        c.on("open",sendP);
        c.on("data",m=>{if(m&&m.t==="p"){remote={isMe:false,kind:"viewer",presence:m.p||{}};fire()}});
        c.on("close",()=>{if(conn===c){conn=null;remote=null;fire()}});
        c.on("error",()=>{});
        if(c.open)sendP();
      };
      const api={
        peers(){return remote?[me,remote]:[me]},
        onPeers(f){cbs.push(f)},
        presence(o){Object.assign(me.presence,o);sendP();return Promise.resolve()},
        leave(){cbs=[];try{peer&&peer.destroy()}catch(e){}return Promise.resolve()}
      };
      const fail=m=>{if(done)return;done=true;try{peer&&peer.destroy()}catch(e){}reject(new Error(m))};
      if(host){
        peer=new Peer(ID,OPT);
        peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
        peer.on("open",()=>{if(!done){done=true;resolve(api)}});
        peer.on("connection",c=>{
          if(conn&&conn.open){c.on("open",()=>c.close());return}
          attach(c);
        });
        peer.on("error",e=>fail(e.type==="unavailable-id"?"taken":e.type));
      }else{
        peer=new Peer(OPT);
        let tries=0;
        const go=()=>{
          const c=peer.connect(ID,{reliable:true});
          attach(c);
          c.on("open",()=>{if(!done){done=true;resolve(api)}});
        };
        peer.on("open",go);
        peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
        peer.on("error",e=>{
          if(e.type==="peer-unavailable"&&tries<3&&!done){tries++;setTimeout(()=>{if(!done)go()},2000);return}
          fail(e.type==="peer-unavailable"?"Code nicht gefunden":e.type);
        });
      }
      setTimeout(()=>fail("Zeitüberschreitung"),20000);
    });
  }
};

function tallies(){

const hlRec=()=>{try{return +localStorage.getItem("fqrec")||0}catch(e){return 0}};

    body=`<div class="big">${same?"🧠":"🙈"}</div><h2 style="text-align:center">${same?"Gleiche Antwort! +1":"Verschieden"}</h2><div class="g g2"><div class="o ${same?"ok":"dim"}">Du<br>${esc(S.tt[r])}</div><div class="o ${same?"ok":"dim"}">${esc(oppName())}<br>${th?esc(th):"…"}</div></div>`;
  }else{
    body=`<input id="ti" maxlength="30" placeholder="Deine Antwort" autocomplete="off" value="${esc(S.tsub?S.tt[r]:"")}"${S.tsub?" disabled":""}><button class="btn" data-a="tsend"${S.tsub?" disabled":""}>Antwort einreichen</button><div id="tw" class="note">${S.tsub?(oh[r]?"Dein Freund hat geantwortet ✓":"Warte auf "+esc(oppName())+" …"):(oh[r]?"Dein Freund hat schon geantwortet ✓":"")}</div>`;
  }
  app.innerHTML=`<button class="back" data-a="menu">← Menü</button><div class="top"><div class="pl"><b>🧠 Treffer</b><span id="ts">${telScore()}</span></div><div class="pn">Frage ${r+1}/${S.qs.length}</div><div class="pl r"><b>${esc(oppName())}</b><span>${o?"🟢":"⚪"}</span></div></div><div class="card"><div class="tag">Beide müssen dasselbe schreiben</div><h2>${esc(q)}</h2>${body}</div>`;
  const i=document.getElementById("ti");if(i&&!S.tsub)i.focus();
}
function podiumAnim(){
  document.querySelectorAll(".cnt").forEach(e=>{const v=+e.dataset.v,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1200);e.textContent=Math.round(v*k);if(k<1&&e.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
function podium(){
  const o=S.online?opp():null,u=S.mode==="h"?"Streak":S.mode==="g"?"Treffer":S.mode==="j"?"Richtige":"Punkte";
  if(o&&o.presence.d!==1)return `<div class="big">⏳</div><h1>${esc(oppName())} spielt noch …</h1><div class="card" style="text-align:center"><div class="tag">Dein Ergebnis</div><h2>${S.score} ${u}</h2></div><button class="btn alt" data-a="menu">Zum Menü</button>`;
  const pl=[{n:S.name||"Du",a:ball(AVC[S.av]||AVC[0]),s:S.score}];
  if(o)pl.push({n:oppName(),a:oppAv(),s:o.presence.s||0});
  pl.sort((x,y)=>y.s-x.s);
  const tie=pl.length>1&&pl[0].s===pl[1].s;
  const col=(p,h,w)=>`<div class="pcol"><div class="pav">${p.a}</div><div class="pnm">${esc(p.n)}</div>${w?'<div class="trophy">🏆</div>':'<div style="height:48px"></div>'}<div class="step${w?" g":""}" style="height:${h}px"><b class="cnt" data-v="${p.s}">0</b><small>${u}</small></div></div>`;
  let row,title;
  if(pl.length===1){row=col(pl[0],150,1);title="Starke Runde!"}
  else if(tie){row=col(pl[0],150,1)+col(pl[1],150,1);title="Unentschieden!"}
  else{row=col(pl[1],105,0)+col(pl[0],150,1)+'<div class="pcol"><div class="step e" style="height:70px"></div></div>';title=esc(pl[0].n)+" gewinnt!"}
  if(S.mode==="g")title="Team-Ergebnis: "+S.score+" von "+S.qs.length+" Treffern";
  const cf=Array.from({length:14},(_,i)=>`<i class="cf" style="left:${4+i*7}%;animation-delay:${(i%5)*.3+1.1}s">${["🎉","✨","⭐","🎊"][i%4]}</i>`).join("");
  return `<div class="pod">${cf}<h1>${title}</h1><div class="prow">${row}</div></div>${!S.online||S.host?'<button class="btn" data-a="again">Nochmal spielen</button>':'<p class="note">Der Host startet die nächste Runde.</p>'}<button class="btn alt" data-a="menu">Zum Menü</button>`;
}
function hostStart(){
  const go=Date.now(),seed=go%100000;
  if(RM)RM.presence({go,mode:S.mode,seed}).catch(()=>{});
  startGame(S.mode,seed,go);
}

function syncStart(){
  if(!S.online||S.host)return;
  const h=hostPeer();
  if(h&&h.presence.go&&h.presence.go!==S.run)startGame(h.presence.mode||"x",h.presence.seed||1,h.presence.go);
}

function onPeers(){
  if(!S.online)return;
  syncStart();
  if(S.view==="lobby"||S.view==="result")paint();
  else if(S.view==="game"){paintScores();checkReveal()}else if(S.view==="pen"){paintPen();penCheck()}else if(S.view==="hl"){const e=document.getElementById("os"),o=opp();if(e)e.textContent=o?(o.presence.s||0):0}else if(S.view==="tel")telCheck();
}

const newCode=()=>{const c="abcdefghjkmnpqrstuvwxyz23456789";let k="";for(let i=0;i<4;i++)k+=c[Math.floor(Math.random()*c.length)];return k};
async function enter(code,host){
  if(!R)return;
  S.err="";
  for(let i=0;;i++){
    try{RM=await R.join("fq"+code,host);break}
    catch(e){
      if(host&&e.message==="taken"&&i<5){code=newCode();continue}
      S.err="Raum nicht erreichbar ("+e.message+"). Versuch es nochmal.";paint();return;
    }
  }
  S.online=true;S.host=host;S.code=code;S.run=0;
  RM.onPeers(onPeers);
  RM.presence({n:S.name||"Spieler",v:S.av,h:host?1:0,mode:S.mode,s:0,a:[],d:0}).catch(()=>{});
  S.view="lobby";paint();
}

async function menu(){
  clearInterval(tm);
  if(RM){try{await RM.leave()}catch(e){}}
  RM=null;S.online=false;S.host=false;S.view="home";S.err="";paint();
}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="mode"){S.mode=b.dataset.m;if(RM&&S.host)RM.presence({mode:S.mode}).catch(()=>{});paint()}
  else if(a==="solo"){if(S.mode==="g"){S.err="Telepathie geht nur im Online-Duell.";paint();return}S.online=false;startGame(S.mode,Date.now()%100000,0)}
  else if(a==="create")enter(newCode(),true)
  else if(a==="join"){const k=S.codeIn.trim().toLowerCase();if(!/^[a-z0-9]{4}$/.test(k)){S.err="Bitte den 4-stelligen Code eingeben.";paint();return}enter(k,false)}
  else if(a==="start")hostStart();
  else if(a==="again"){if(S.online)hostStart();else startGame(S.mode,Date.now()%100000,0)}
  else if(a==="menu")menu();
  else if(a==="opt")choose(+b.dataset.i);else if(a==="pen")penPick(+b.dataset.i);else if(a==="hl")hlGuess(b.dataset.g);else if(a==="tsend")telSubmit();else if(a==="av"){S.av=+b.dataset.i;try{localStorage.setItem("fqav",S.av)}catch(x){}paint()}
});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ti")telSubmit()});
app.addEventListener("input",e=>{
  if(e.target.id==="nm"){S.name=e.target.value.slice(0,14);try{localStorage.setItem("fqn",S.name)}catch(x){}}
  if(e.target.id==="cd")S.codeIn=e.target.value;
});
paint();
</script>
</body>
</html>
